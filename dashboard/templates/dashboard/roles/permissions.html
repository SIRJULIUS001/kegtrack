{% extends "base.html" %}
{% block content %}

<div class="p-6">

    <h1 class="text-xl font-bold mb-4">
        Permissions - {{ role.name }}
    </h1>

    <form method="POST" class="bg-white p-6 rounded shadow">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-3">

            {% for perm in permissions %}

            <label class="border p-2 rounded flex items-center gap-2">

                <input type="checkbox"
                       name="permissions"
                       value="{{ perm.code }}"
                       {% if perm.code in selected %}checked{% endif %}>

                <div>
                    <div class="font-medium">{{ perm.name }}</div>
                    <div class="text-xs text-gray-400">{{ perm.code }}</div>
                </div>

            </label>

            {% endfor %}

        </div>

        <button class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded">
            Save Permissions
        </button>

    </form>

</div>

{% endblock %}
