{% extends "base.html" %}
{% block content %}

<div class="p-6 max-w-xl">

    <!-- HEADER -->
    <h1 class="text-2xl font-bold mb-1">Create Role</h1>
    <p class="text-sm text-gray-500 mb-6">
        Define a new global or business role template
    </p>

    <!-- FORM -->
    <form method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
        {% csrf_token %}

        <!-- ROLE NAME -->
        <div>
            <label class="text-sm font-medium text-gray-700">Role Name</label>
            <input type="text"
                   name="name"
                   required
                   placeholder="e.g Manager, Cashier"
                   class="w-full mt-1 border rounded px-3 py-2 focus:ring focus:ring-indigo-200">
        </div>

        <!-- SUBMIT -->
        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded">
            Create Role
        </button>

    </form>

</div>

{% endblock %}
