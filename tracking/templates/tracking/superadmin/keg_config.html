{% extends "tracking/superadmin/keg_dashboard.html" %}

{% block keg_content %}

<form method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
    {% csrf_token %}

    <h2 class="font-semibold text-lg">System Configuration</h2>

    <label><input type="checkbox" name="enable_keg_tracking" {% if config.enable_keg_tracking %}checked{% endif %}> Enable Keg Tracking</label>

    <label><input type="checkbox" name="force_verification" {% if config.force_verification %}checked{% endif %}> Force Verification</label>

    <label><input type="checkbox" name="require_photo_proof" {% if config.require_photo_proof %}checked{% endif %}> Require Photo Proof</label>

    <label><input type="checkbox" name="require_weight_check" {% if config.require_weight_check %}checked{% endif %}> Require Weight Check</label>

    <label><input type="checkbox" name="live_camera_only" {% if config.live_camera_only %}checked{% endif %}> Live Camera Only</label>

    <div>
        <label>Variance Threshold (%)</label>
        <input type="number" step="0.1" name="variance_threshold_percent"
               value="{{ config.variance_threshold_percent }}"
               class="border p-2 rounded w-full">
    </div>

    <div>
        <label>Beer Density</label>
        <input type="number" step="0.01" name="beer_density"
               value="{{ config.beer_density }}"
               class="border p-2 rounded w-full">
    </div>

    <button class="bg-green-600 text-white px-4 py-2 rounded">
        Save Settings
    </button>

</form>

{% endblock %}
