<div class="bg-white border-b px-3 py-2 flex gap-2 overflow-x-auto">

    {% for category in categories %}
        <button
            class="px-3 py-1 text-sm bg-slate-100 rounded-full hover:bg-indigo-600 hover:text-white"
            hx-get="{% url 'pos:product_filter' %}?category={{ category.id }}"
            hx-target="#product-grid"
            hx-swap="innerHTML">
            {{ category.name }}
        </button>
    {% endfor %}

</div>
