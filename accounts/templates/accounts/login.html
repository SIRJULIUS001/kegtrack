{% extends "base_public.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-slate-50">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8 border border-slate-100">

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
            <p class="text-sm text-slate-500">Login to KegTracker Dashboard</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 text-sm text-red-600 bg-red-50 p-3 rounded-lg">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="text-sm font-medium">Username</label>
                <input type="text" name="username"
                       class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="mb-6">
                <label class="text-sm font-medium">Password</label>
                <input type="password" name="password"
                       class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Don’t have an account?
            <a href="#" class="text-indigo-600 font-semibold">Register</a>
        </p>

    </div>
</div>

{% endblock %}
