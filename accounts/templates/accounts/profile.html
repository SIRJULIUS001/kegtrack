{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="bg-white p-8 rounded-2xl shadow border border-slate-100">

        <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-indigo-100 rounded-xl flex items-center justify-center">
                <i class="bi bi-person text-2xl text-indigo-600"></i>
            </div>

            <div>
                <h1 class="text-xl font-bold text-slate-900">
                    {{ user.get_full_name }}
                </h1>
                <p class="text-sm text-slate-500">
                    {{ user.role_name }} • {{ user.business_name }}
                </p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">

            <div class="p-4 bg-slate-50 rounded-lg">
                <p class="text-slate-500">Username</p>
                <p class="font-semibold">{{ user.username }}</p>
            </div>

            <div class="p-4 bg-slate-50 rounded-lg">
                <p class="text-slate-500">Email</p>
                <p class="font-semibold">{{ user.email }}</p>
            </div>

            <div class="p-4 bg-slate-50 rounded-lg">
                <p class="text-slate-500">Phone</p>
                <p class="font-semibold">{{ user.phone }}</p>
            </div>

            <div class="p-4 bg-slate-50 rounded-lg">
                <p class="text-slate-500">Role</p>
                <p class="font-semibold">{{ user.role_name }}</p>
            </div>

        </div>

    </div>

</div>

{% endblock %}
