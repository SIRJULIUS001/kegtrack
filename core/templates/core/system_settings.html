{% extends "base.html" %}
{% block content %}

<div class="p-6 max-w-5xl space-y-6">

<h1 class="text-2xl font-bold">System Settings</h1>

<form method="POST" enctype="multipart/form-data" class="space-y-6">
{% csrf_token %}

<!-- KEG SETTINGS -->
<div class="bg-white p-6 rounded shadow">
    <h2 class="font-semibold mb-4">Keg & Inventory</h2>

    <input name="default_keg_weight" value="{{ settings.default_keg_weight }}" placeholder="Keg Weight" class="input">
    <input name="beer_density" value="{{ settings.beer_density }}" placeholder="Beer Density" class="input">

    <select name="volume_unit" class="input">
        <option value="L" {% if settings.volume_unit == "L" %}selected{% endif %}>Litres</option>
        <option value="ML" {% if settings.volume_unit == "ML" %}selected{% endif %}>Millilitres</option>
    </select>
</div>

<!-- FEATURE TOGGLES -->
<div class="bg-white p-6 rounded shadow">
    <h2 class="font-semibold mb-4">Features</h2>

    <label><input type="checkbox" name="enable_pos" {% if settings.enable_pos %}checked{% endif %}> POS</label>
    <label><input type="checkbox" name="enable_keg_tracking" {% if settings.enable_keg_tracking %}checked{% endif %}> Keg Tracking</label>
    <label><input type="checkbox" name="enable_analytics" {% if settings.enable_analytics %}checked{% endif %}> Analytics</label>
    <label><input type="checkbox" name="enable_whatsapp" {% if settings.enable_whatsapp %}checked{% endif %}> WhatsApp</label>
</div>

<!-- BUSINESS RULES -->
<div class="bg-white p-6 rounded shadow">
    <h2 class="font-semibold mb-4">Business Rules</h2>

    <label><input type="checkbox" name="allow_self_registration" {% if settings.allow_self_registration %}checked{% endif %}> Allow Registration</label>

    <input name="max_staff_per_business" value="{{ settings.max_staff_per_business }}" class="input">
    <input name="trial_days" value="{{ settings.trial_days }}" class="input">
</div>

<!-- SECURITY -->
<div class="bg-white p-6 rounded shadow">
    <h2 class="font-semibold mb-4">Security</h2>

    <label><input type="checkbox" name="force_password_change" {% if settings.force_password_change %}checked{% endif %}> Force Password Change</label>
    <label><input type="checkbox" name="allow_multi_login" {% if settings.allow_multi_login %}checked{% endif %}> Multi Login</label>

    <input name="session_timeout" value="{{ settings.session_timeout }}" class="input">
</div>

<!-- AUDIT -->
<div class="bg-white p-6 rounded shadow">
    <h2 class="font-semibold mb-4">Audit Logs</h2>

    <label><input type="checkbox" name="enable_audit_logs" {% if settings.enable_audit_logs %}checked{% endif %}> Enable Logs</label>

    <select name="audit_log_level" class="input">
        <option value="minimal" {% if settings.audit_log_level == "minimal" %}selected{% endif %}>Minimal</option>
        <option value="detailed" {% if settings.audit_log_level == "detailed" %}selected{% endif %}>Detailed</option>
    </select>

    <input name="audit_retention_days" value="{{ settings.audit_retention_days }}" class="input">
</div>

<!-- BRANDING -->
<div class="bg-white p-6 rounded shadow">
    <h2 class="font-semibold mb-4">Branding</h2>

    <input name="system_name" value="{{ settings.system_name }}" class="input">
    <input type="file" name="logo">
    <input name="theme_color" value="{{ settings.theme_color }}" class="input">
</div>

<button class="bg-indigo-600 text-white px-6 py-2 rounded">
    Save Settings
</button>

</form>
</div>

{% endblock %}
