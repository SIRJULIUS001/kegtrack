{% extends 'base.html' %}
{% block content %}

<div class="p-6 max-w-3xl mx-auto">

    <h1 class="text-2xl font-bold mb-6">
        Create Business + Owner
    </h1>

    <form method="POST" class="space-y-6 bg-white p-6 rounded-2xl shadow">
        {% csrf_token %}

        <!-- BUSINESS INFO -->
        <div>
            <h2 class="font-semibold mb-3 text-slate-700">Business Info</h2>

            <input type="text" name="business_name"
                   placeholder="Business Name"
                   class="w-full p-3 border rounded-lg mb-3" required>

            <!-- TYPE -->
            <select name="business_type"
                    class="w-full p-3 border rounded-lg mb-3" required>
                <option value="">Select Business Type</option>
                <option value="pub">Pub</option>
                <option value="club">Club</option>
                <option value="bar">Bar</option>
                <option value="restaurant">Restaurant</option>
            </select>

            <input type="email" name="business_email"
                   placeholder="Business Email"
                   class="w-full p-3 border rounded-lg mb-3">

            <input type="text" name="phone"
                   placeholder="Business Phone"
                   class="w-full p-3 border rounded-lg mb-3">

            <input type="text" name="address"
                   placeholder="Business Address"
                   class="w-full p-3 border rounded-lg">
        </div>

        <!-- OWNER INFO -->
        <div>
            <h2 class="font-semibold mb-3 text-slate-700">Owner Account</h2>

            <input type="text" name="username"
                   placeholder="Owner Username"
                   class="w-full p-3 border rounded-lg mb-3" required>

            <input type="email" name="email"
                   placeholder="Owner Email"
                   class="w-full p-3 border rounded-lg mb-3" required>

            <input type="text" name="owner_phone"
                   placeholder="Owner Phone"
                   class="w-full p-3 border rounded-lg mb-3">

            <input type="password" name="password"
                   placeholder="Password"
                   class="w-full p-3 border rounded-lg mb-3" required>
        </div>

        <!-- SUBMIT -->
        <div class="flex justify-end gap-3">

            <a href="{% url 'core:business_list' %}"
               class="px-4 py-2 rounded-lg border hover:bg-slate-100">
                Cancel
            </a>

            <button type="submit"
                    class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                Create Business
            </button>

        </div>

    </form>

</div>

{% endblock %}
