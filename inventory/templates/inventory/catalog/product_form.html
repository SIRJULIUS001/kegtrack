{% extends "base.html" %}
{% block title %}Product Form{% endblock %}

{% block content %}

<div class="p-6 max-w-2xl mx-auto space-y-6">

    <!-- ===================== -->
    <!-- HEADER -->
    <!-- ===================== -->
    <div>
        <h1 class="text-2xl font-bold text-slate-900">
            {% if product %}Edit Product{% else %}Add Product{% endif %}
        </h1>
        <p class="text-sm text-slate-500">
            Manage global product catalog (categories & subcategories)
        </p>
    </div>

    <!-- ===================== -->
    <!-- FORM -->
    <!-- ===================== -->
    <form method="POST" class="bg-white p-6 rounded-xl shadow space-y-5">
        {% csrf_token %}

        <!-- PRODUCT NAME -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Product Name
            </label>

            <input type="text"
                   name="name"
                   value="{{ product.name|default:'' }}"
                   required
                   class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                   placeholder="e.g Tusker Lager">
        </div>

        <!-- CATEGORY / SUBCATEGORY -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Category / Subcategory
            </label>

            <select name="category"
                    required
                    class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-indigo-500">

                <option value="">Select category</option>

                {% for cat in categories %}

                    {% if not cat.parent %}
                        <!-- PARENT CATEGORY -->
                        <option value="{{ cat.id }}"
                            {% if product and product.category.id == cat.id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>

                        <!-- SUBCATEGORIES -->
                        {% for sub in cat.subcategories.all %}
                            <option value="{{ sub.id }}"
                                {% if product and product.category.id == sub.id %}selected{% endif %}>
                                └─ {{ sub.name }}
                            </option>
                        {% endfor %}
                    {% endif %}

                {% endfor %}

            </select>
        </div>

        <!-- ACTIONS -->
        <div class="flex justify-between items-center pt-4">

            <a href="{% url 'inventory:product_list' %}"
               class="text-slate-500 hover:underline">
                ← Back to Products
            </a>

            <button type="submit"
                    class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                {% if product %}Update{% else %}Create{% endif %}
            </button>

        </div>

    </form>

</div>

{% endblock %}
