{% extends "base.html" %}
{% load utils %}
{% block content %}

<div class="h-screen flex flex-col bg-slate-100">

<!-- ================= TOP BAR ================= -->
<div class="bg-white border-b px-4 py-3 flex justify-between items-center">

    <h1 class="font-bold text-lg">
        POS Terminal
    </h1>

    <form method="GET">
        <select name="location"
                onchange="this.form.submit()"
                class="border rounded px-3 py-2 text-sm w-48">

            <option value="">Select Counter</option>

            {% for loc in locations %}
                <option value="{{ loc.id }}"
                    {% if location_id == loc.id|stringformat:"s" %}selected{% endif %}>
                    {{ loc.name }}
                </option>
            {% endfor %}

        </select>
    </form>

</div>

<!-- ================= MAIN GRID ================= -->
<div class="flex flex-1 overflow-hidden">

<!-- ================= LEFT ================= -->
<div class="w-2/5 bg-white border-r flex flex-col">

    <div class="p-3 border-b space-y-2">

        <div class="font-semibold">Product Catalog</div>

        <input
            type="text"
            name="search"
            placeholder="Search products..."
            class="w-full border rounded px-3 py-2 text-sm"
            hx-get="{% url 'inventory:product_search' %}"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#product-list"
            hx-swap="innerHTML"
            hx-include="[name='location']"
        >

    </div>

    <div id="product-list"
         class="flex-1 overflow-y-auto p-3 space-y-3"
         hx-get="{% url 'inventory:product_search' %}?location={{ location_id }}"
         hx-trigger="load"
         hx-swap="innerHTML">

        <p class="text-slate-400 text-sm">Loading products...</p>

    </div>

</div>

<!-- ================= CENTER ================= -->
<div class="w-1/3 bg-slate-50 flex flex-col">

    <div class="p-3 border-b font-semibold">
        Pending Stock Movement
    </div>

    <div id="cart"
         class="flex-1 overflow-y-auto p-3 space-y-2"
         hx-get="{% url 'inventory:cart_partial' %}?location={{ location_id }}"
         hx-trigger="load, refresh-cart from:body"
         hx-swap="innerHTML">

        <p class="text-sm text-slate-400">
            Select products to stage stock movement
        </p>

    </div>

    <div class="p-3 border-t bg-white">

        <form method="POST"
              action="{% url 'inventory:stock_commit' %}"
              hx-post="{% url 'inventory:stock_commit' %}"
              hx-on::after-request="
                  htmx.trigger('#cart', 'refresh-cart');
                  htmx.trigger('#stock-panel', 'refresh-stock');
              ">

            {% csrf_token %}
            <input type="hidden" name="location_id" value="{{ location_id }}">

            <button class="w-full bg-green-600 text-white py-2 rounded font-medium">
                Commit Stock
            </button>

        </form>

    </div>

</div>

<!-- ================= RIGHT ================= -->
<div class="w-1/4 bg-white border-l flex flex-col">

    <div class="p-3 border-b font-semibold">
        Live Stock
    </div>

    <div id="stock-panel"
         class="flex-1 overflow-y-auto p-3 space-y-2"
         hx-get="{% url 'inventory:stock_panel' %}?location={{ location_id }}"
         hx-trigger="load, every 5s, refresh-stock from:body"
         hx-swap="innerHTML">

        <p class="text-slate-400 text-sm">Loading stock...</p>

    </div>

</div>

</div>
</div>

<!-- ================= TOAST ================= -->
<div id="toast-container"
     class="fixed top-20 right-6 z-50 w-80 space-y-3"></div>

<!-- ================= 🔥 FIX: HTMX CSRF HANDLER ================= -->
<script>
/* ================================
   CSRF HANDLER (HTMX SAFE)
================================ */
document.body.addEventListener("htmx:configRequest", function (event) {
    const token = document.querySelector('[name=csrfmiddlewaretoken]');
    if (token) {
        event.detail.headers['X-CSRFToken'] = token.value;
    }
});


/* ================================
   HTMX JSON RESPONSE HANDLER
================================ */
document.body.addEventListener("htmx:afterRequest", function (evt) {

    const xhr = evt.detail.xhr;
    if (!xhr || !xhr.responseText) return;

    const contentType = xhr.getResponseHeader("Content-Type") || "";

    // Only handle JSON responses
    if (!contentType.includes("json")) return;

    try {
        const data = JSON.parse(xhr.responseText);

        /* ================= TOAST ================= */
        if (data.success) {
            showToast(data.message || "Success", "success");
        }

        if (data.error) {
            showToast(data.error, "error");
        }

        /* ================= REFRESH CART ================= */
        if (data.refresh_cart) {
            htmx.trigger("#cart", "refresh-cart");
        }

        /* ================= REFRESH STOCK ================= */
        if (data.refresh_stock) {
            htmx.trigger("#stock-panel", "refresh-stock");
        }

    } catch (e) {
        console.error("HTMX JSON parse error:", e);
        showToast("Unexpected server response", "error");
    }
});
</script>
{% endblock %}
