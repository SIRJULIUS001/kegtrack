<div class="p-4 bg-white rounded-lg shadow">

    <h2 class="text-lg font-bold mb-4">
        Pending Stock
    </h2>

    <form
        method="POST"
        action="{% url 'inventory:stock_commit' %}"

        hx-post="{% url 'inventory:stock_commit' %}"
        hx-swap="none"

        hx-on::after-request="
            htmx.trigger('#cart', 'refresh-cart');
            htmx.trigger('#stock-panel', 'refresh-stock');
        ">

        {% csrf_token %}

        <input
            type="hidden"
            name="location_id"
            value="{{ location_id }}">

        <!-- ================= ITEMS ================= -->
        <div class="space-y-3">

            {% for item in cart_items %}
            <div class="border rounded-lg p-3 bg-slate-50 text-sm">

                <!-- PRODUCT -->
                <div class="font-semibold text-slate-800">
                    {{ item.name }} ({{ item.volume }})
                </div>

                <!-- QTY + PRICE -->
                <div class="flex justify-between mt-2 text-xs text-slate-600">

                    <!-- QTY -->
                    <div>
                        <label class="block mb-1">
                            Qty
                        </label>

                        <input
                            type="number"
                            name="qty_{{ item.variant_id }}"
                            value="{{ item.qty }}"
                            min="0"
                            class="w-16 border rounded px-2 py-1 text-sm font-semibold text-slate-900">
                    </div>

                    <!-- PRICE -->
                    <div>
                        <label class="block mb-1">
                            Price
                        </label>

                        <input
                            type="number"
                            name="price_{{ item.variant_id }}"
                            value="{{ item.price }}"
                            step="0.01"
                            class="w-24 border rounded px-2 py-1 text-sm font-semibold text-indigo-600">
                    </div>

                </div>

                <!-- LINE TOTAL -->
                <div class="flex justify-between mt-3 border-t pt-2 text-xs">

                    <span class="text-slate-500">
                        Line Total
                    </span>

                    <span class="font-bold text-slate-900">
                        {{ item.total }}
                    </span>

                </div>

            </div>

            {% empty %}
            <div class="text-sm text-slate-400 text-center py-6">
                Cart is empty
            </div>
            {% endfor %}

        </div>

        <!-- ================= TOTAL ================= -->
        <div class="mt-4 border-t pt-3 flex justify-between text-sm font-bold">

            <span>Total</span>

            <span class="text-green-700">
                {{ cart_total }}
            </span>

        </div>

        <!-- ================= SUBMIT ================= -->
        <div class="mt-4">

            <button
                type="submit"
                hx-disabled-elt="this"
                class="w-full bg-green-600 hover:bg-green-700 transition text-white py-2 rounded font-medium">

                Commit Stock

            </button>

        </div>

    </form>

</div>
